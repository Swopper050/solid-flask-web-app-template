apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../app

namespace: my-solid-app-staging

patches:
  - target:
      kind: Ingress
      name: my-solid-app-ui
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.app.my-solid-app.com
      - op: replace
        path: /spec/rules/0/host
        value: staging.app.my-solid-app.com
  - target:
      kind: Ingress
      name: my-solid-app-api
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.api.my-solid-app.com
      - op: replace
        path: /spec/rules/0/host
        value: staging.api.my-solid-app.com

configMapGenerator:
  - name: my-solid-app-backend-config
    behavior: merge
    literals:
      - MY_SOLID_APP_FRONTEND_URL="https://staging.app.my-solid-app.com"
      - MY_SOLID_APP_DB_NAME="my_solid_app_staging_db"
      - MY_SOLID_APP_DB_HOST="<vps_ip>"

secretGenerator:
  - name: my-solid-app-backend-secrets
    literals:
      - MY_SOLID_APP_SECRET_KEY=${MY_SOLID_APP_STAGING_SECRET_KEY}
      - MY_SOLID_APP_FERNET_SECRET_KEY=${MY_SOLID_APP_STAGING_FERNET_SECRET_KEY}
      - MY_SOLID_APP_DB_USER=${MY_SOLID_APP_STAGING_DB_USER}
      - MY_SOLID_APP_DB_PASSWORD=${MY_SOLID_APP_STAGING_DB_PASSWORD}
      - MY_SOLID_APP_MAIL_SERVER=${MY_SOLID_APP_STAGING_MAIL_SERVER}
      - MY_SOLID_APP_MAIL_USERNAME=${MY_SOLID_APP_STAGING_MAIL_USERNAME}
      - MY_SOLID_APP_MAIL_PASSWORD=${MY_SOLID_APP_STAGING_MAIL_PASSWORD}
      - MY_SOLID_APP_MAIL_DEFAULT_SENDER=${MY_SOLID_APP_STAGING_MAIL_DEFAULT_SENDER}
